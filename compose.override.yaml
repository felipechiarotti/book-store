services:
  bookstore.api:
    container_name: bookstore_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Serilog__MinimumLevel__Default: ${LOG_LEVEL:-Verbose}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=bookstore_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Loans__DurationDays: ${LOAN_DURATION_DAYS:-7}
      Pagination__DefaultPageSize: ${PAGINATION_DEFAULT_PAGE_SIZE:-20}
      CatalogCache__TimeToLiveSeconds: ${CATALOG_CACHE_TTL_SECONDS:-60}
      CatalogCache__OperationTimeoutMilliseconds: ${CATALOG_CACHE_OPERATION_TIMEOUT_MS:-200}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-BookStore.Api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    ports:
      - "15080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  
  postgres:
    container_name: bookstore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookstore_db
    ports:
      - "15432:5432"

  redis:
    container_name: bookstore_cache
    restart: unless-stopped
