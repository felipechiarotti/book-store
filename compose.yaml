services:
  bookstore.api:
    image: bookstore.api
    build:
      context: .
      dockerfile: src/BookStore.Api/Dockerfile
    networks:
      - bookstore_net

  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstore_net

  redis:
    image: redis:8-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - bookstore_net

volumes:
  postgres_data:

networks:
  bookstore_net:
    driver: bridge
